<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitBuddy - AI Workout Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
        }
        label {
            font-weight: 600;
            color: #444;
            display: block;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .admin-link {
            text-align: center;
            margin-top: 15px;
            display: block;
            color: #6b7280;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>💪 FitBuddy - AI Workout Generator</h2>
        <form action="/generate-workout" method="post">
            <label>Name:</label>
            <input type="text" name="username" placeholder="Enter your name" required>

            <label>User ID:</label>
            <input type="number" name="user_id" placeholder="e.g. 101" required>

            <label>Age:</label>
            <input type="number" name="age" placeholder="e.g. 21" required>

            <label>Weight (kg):</label>
            <input type="number" step="0.1" name="weight" placeholder="e.g. 65.5" required>

            <label>Fitness Goal:</label>
            <input type="text" name="goal" placeholder="e.g., weight loss, muscle gain, flexibility" required>

            <label>Workout Intensity:</label>
            <select name="intensity">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">Generate Plan</button>
        </form>
        <a href="/view-all-users" class="admin-link">Go to Admin Dashboard</a>
    </div>
</body>
</html>
